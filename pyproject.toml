[project]
name = "omnishot"
version = "0.1.0"
description = "Semantic macOS screenshots with local AI naming, agent-ready SSH payloads, image paste, and S3 links"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sourya Kakarla" }]
keywords = ["screenshot", "agent", "s3", "macos", "ocr", "clipboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Topic :: Utilities",
]
dependencies = [
    "boto3",
    "langfuse",
    "watchdog",
    "pyobjc-framework-Vision",
]

[project.urls]
Repository = "https://github.com/ma08/omnishot"

[project.scripts]
omnishot = "omnishot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnishot"]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
